<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adopción de IA Mayoreo</title>
<style>
/* Layout: encabezado con filtro global + pestañas; cada vista responde una pregunta de gestión, del indicador a su detalle. */
:root{
  --azul:#009EE3; --azul-oscuro:#0079AC; --azul-tenue:#EAF7FD;
  --gris:#707173; --gris-claro:#C6C6C5; --linea:#E2E4E6;
  --rojo:#C0392B; --rojo-tenue:#FDEEEC; --verde:#1E8A4C; --ambar:#B8860B; --ambar-tenue:#FDF6E3;
  --tinta:#1A1C1E; --fondo:#F7F8F9; --panel:#fff; --calc:#FAFBFC; --fila:#F0F1F2;
  --s-ambos:#00527A; --s-ini:#009EE3; --s-form:#9AD8F4; --s-sin:#E2E4E6;
  --sobre-azul:#fff;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --azul:#2AB3F0; --azul-oscuro:#7FD0F7; --azul-tenue:#12303F;
  --gris:#A3A7AB; --gris-claro:#4A4F54; --linea:#2E3236;
  --rojo:#F08A7E; --rojo-tenue:#3A1F1C; --verde:#5CC98A; --ambar:#E0B040; --ambar-tenue:#33290F;
  --tinta:#E8EAEC; --fondo:#121416; --panel:#1B1E21; --calc:#202428; --fila:#272B2F;
  --s-ambos:#C4ECFD; --s-ini:#2AB3F0; --s-form:#1F6485; --s-sin:#2E3236;
  --sobre-azul:#06202C; color-scheme:dark } }
:root[data-theme="dark"]{
  --azul:#2AB3F0; --azul-oscuro:#7FD0F7; --azul-tenue:#12303F;
  --gris:#A3A7AB; --gris-claro:#4A4F54; --linea:#2E3236;
  --rojo:#F08A7E; --rojo-tenue:#3A1F1C; --verde:#5CC98A; --ambar:#E0B040; --ambar-tenue:#33290F;
  --tinta:#E8EAEC; --fondo:#121416; --panel:#1B1E21; --calc:#202428; --fila:#272B2F;
  --s-ambos:#C4ECFD; --s-ini:#2AB3F0; --s-form:#1F6485; --s-sin:#2E3236;
  --sobre-azul:#06202C; color-scheme:dark }
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;color:var(--tinta);background:var(--fondo);font-size:14px;line-height:1.45}
.num{font-variant-numeric:tabular-nums}
header{background:var(--panel);border-bottom:1px solid var(--linea);padding:18px 28px 0}
.marca{display:flex;align-items:center;gap:14px}
.logo{width:40px;height:34px;object-fit:contain;background:#fff;border-radius:3px;padding:2px}
h1{font-size:20px;margin:0;text-wrap:balance}
.sub{font-size:13px;color:var(--gris)}
.barra{display:flex;flex-wrap:wrap;gap:26px;align-items:flex-end;margin-top:14px}
.campo label{display:block;font-size:12px;color:var(--gris);margin-bottom:3px}
.campo select,.campo input{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--gris-claro);border-radius:3px;background:var(--panel);color:var(--tinta);min-width:150px;max-width:100%}
.campo select:focus,.campo input:focus,button:focus-visible{outline:2px solid var(--azul);outline-offset:1px}
.acciones-header{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn-primario{font:inherit;font-size:13px;background:var(--azul);color:var(--sobre-azul);border:1px solid var(--azul);border-radius:3px;padding:6px 12px;cursor:pointer;font-weight:bold;transition:all 150ms ease}
.btn-primario:hover{background:var(--azul-oscuro);border-color:var(--azul-oscuro)}
.btn-outline{font:inherit;font-size:12.5px;background:var(--panel);color:var(--tinta);border:1px solid var(--gris-claro);border-radius:3px;padding:5px 11px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:5px;transition:all 120ms ease}
.btn-outline:hover{border-color:var(--azul);color:var(--azul-oscuro);background:var(--azul-tenue)}
.btn-limpiar{font:inherit;font-size:12px;background:none;border:none;color:var(--azul-oscuro);cursor:pointer;padding:6px 8px;text-decoration:underline}
.btn-limpiar:hover{color:var(--rojo)}
@keyframes spin{100%{transform:rotate(360deg)}}
.spinning{animation:spin .75s linear infinite}
.pestanas{display:flex;gap:6px;margin-top:14px;overflow-x:auto}
.pestanas button{font:inherit;font-size:13px;background:none;border:0;border-bottom:3px solid transparent;color:var(--gris);padding:8px 10px;cursor:pointer;white-space:nowrap;transition:all 120ms ease}
.pestanas button.on{color:var(--azul-oscuro);border-bottom-color:var(--azul);font-weight:bold}
main{padding:22px 28px 60px;display:grid;gap:22px;max-width:1280px}
.g2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px}
.g2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.panel{background:var(--panel);border:1px solid var(--linea);border-radius:4px;min-width:0}
.panel h2{font-size:14px;margin:0;padding:10px 16px;border-bottom:1px solid var(--linea)}
.panel h2 small{font-weight:normal;color:var(--gris);font-size:12px;margin-left:6px}
.cuerpo{padding:14px 16px}
.preg{font-size:12px;color:var(--gris);margin:0 0 12px;max-width:75ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0;border-top:1px solid var(--linea)}
.kpis>div{padding:12px 16px;border-right:1px solid var(--linea)}
.kpis>div:last-child{border-right:0}
.kpis .t{font-size:12px;color:var(--gris)}
.kpis .v{font-size:24px;font-weight:bold;letter-spacing:-.5px}
.kpis .v small{font-size:13px;color:var(--gris);font-weight:normal;letter-spacing:0}
.kpis .p{font-size:11.5px;color:var(--gris)}
.heroe{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;padding:18px 16px}
.cifra{font-size:56px;font-weight:bold;letter-spacing:-2px;line-height:1}
.pie{font-size:12px;color:var(--gris);margin-top:4px}
.comp{display:flex;height:30px;gap:2px;border-radius:3px;overflow:hidden}
.comp span,.bar span{display:block;height:100%;min-width:0}
.sA{background:var(--s-ambos)}.sI{background:var(--s-ini)}.sF{background:var(--s-form)}.sN{background:var(--s-sin)}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;margin-top:10px}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.leyenda b{font-variant-numeric:tabular-nums}
.emp{display:grid;grid-template-columns:120px minmax(0,1fr) 54px 74px;gap:12px;align-items:center;padding:7px 6px;border-bottom:1px solid var(--fila);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;font:inherit;color:inherit;text-align:left}
.emp:hover,.emp.sel{background:var(--azul-tenue)}
.emp .nom b{display:block}
.emp .nom span{font-size:11px;color:var(--gris)}
.bar{display:flex;height:14px;gap:2px;border-radius:3px;overflow:hidden}
.emp .pct{font-weight:bold;text-align:right}
.delta{font-size:11.5px;text-align:right}
.mejora{color:var(--verde)}.empeora{color:var(--rojo)}
.chip{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:10px;white-space:nowrap}
.chip.A{background:var(--s-ambos);color:var(--panel)}
.chip.I{background:var(--s-ini);color:var(--sobre-azul)}
.chip.F{background:var(--s-form);color:var(--tinta)}
.badge-per{font-size:11px;padding:2px 6px;border-radius:3px;background:var(--calc);border:1px solid var(--linea);color:var(--gris);white-space:nowrap}
ul.lect{margin:0;padding-left:18px;display:grid;gap:9px;font-size:13px}
ul.lect b{font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{font-size:10.5px;color:var(--gris);text-align:right;padding:6px 6px;border-bottom:1px solid var(--linea);letter-spacing:.3px;text-transform:uppercase;white-space:nowrap}
tbody td{padding:6px 6px;border-bottom:1px solid var(--fila);text-align:right;font-variant-numeric:tabular-nums;vertical-align:top}
th.izq,td.izq{text-align:left}
tr.calc td{background:var(--calc);font-weight:bold}
tr.fila{cursor:pointer}
tr.fila:hover td{background:var(--azul-tenue)}
tr.det td{background:var(--calc);text-align:left;font-size:12.5px;padding:12px 16px}
tr.det h4{margin:0 0 6px;font-size:11px;color:var(--gris);text-transform:uppercase;letter-spacing:.3px}
tr.det ul{margin:0 0 10px;padding-left:18px}
tr.det ul:last-child{margin-bottom:0}
.mini{display:inline-block;width:70px;height:6px;background:var(--linea);border-radius:3px;vertical-align:middle;margin-left:8px;overflow:hidden}
.mini span{display:block;height:100%;background:var(--azul)}
.calor td{text-align:center;padding:0;border:2px solid var(--panel)}
.calor td.izq{text-align:left;padding:6px}
.calor td div{padding:7px 4px}
svg text{font-family:Arial,Helvetica,sans-serif;fill:var(--tinta)}
svg .eje{fill:var(--gris);font-size:11px}
.lista{display:grid;gap:0}
.lista>div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:7px 2px;border-bottom:1px solid var(--fila);font-size:13px}
.lista>div span{color:var(--gris);font-size:11.5px;display:block}
.lista>div b{font-variant-numeric:tabular-nums;white-space:nowrap}

/* Estilos de Strips de Distribución */
.strip-item{display:grid;grid-template-columns:130px minmax(0,1fr) 56px 64px;gap:10px;align-items:center;padding:7px 8px;border-bottom:1px solid var(--fila);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;font:inherit;color:inherit;text-align:left;border-radius:3px;transition:background 120ms ease}
.strip-item:hover,.strip-item.sel{background:var(--azul-tenue)}
.strip-item .strip-name{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip-item .strip-bar-wrap{display:flex;height:10px;background:var(--linea);border-radius:3px;overflow:hidden}
.strip-item .strip-bar-fill{background:var(--azul);height:100%;border-radius:3px;transition:width 200ms ease}
.strip-item .strip-count{font-weight:bold;text-align:right;font-size:12px}
.strip-item .strip-pct{color:var(--gris);text-align:right;font-size:11.5px}

.aviso{color:var(--ambar);font-size:12px}
.nota{background:var(--ambar-tenue);border:1px solid var(--linea);border-radius:4px;padding:10px 14px;font-size:12.5px}
#tip{position:fixed;pointer-events:none;background:var(--tinta);color:var(--panel);font-size:12px;padding:6px 9px;border-radius:3px;max-width:280px;z-index:99;white-space:pre-line;box-shadow:0 2px 6px rgba(0,0,0,.2)}
dl{margin:0;display:grid;gap:10px}
dt{font-weight:bold}
dd{margin:0;color:var(--gris);max-width:80ch}
@media (max-width:980px){.g2,.g2e{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){
  header{padding:14px 16px 0} main{padding:16px 16px 50px}
  .heroe{grid-template-columns:minmax(0,1fr);gap:14px}
  .emp{grid-template-columns:86px minmax(0,1fr) 48px}
  .emp .delta{display:none}
  .strip-item{grid-template-columns:100px minmax(0,1fr) 48px;gap:8px}
  .strip-item .strip-pct{display:none}
  .kpis>div{border-right:0;border-bottom:1px solid var(--linea)}
}
@media print{.acciones-header,.barra,.pestanas{display:none}.panel{border:0}}
</style>

function filasIni(){
  const S_all = scope().filter(p=>p.i>0);
  const k = qIni.trim().toLowerCase();

  // Filtrado reactivo del dashboard
  const S_filtered = S_all.filter(p=>{
    const matchDep = !fDepIni || p.d === fDepIni;
    const matchQ = !k || (p.n + ' ' + p.ini.join(' ')).toLowerCase().includes(k);
    return matchDep && matchQ;
  });

  // Métricas
  const totalColabs = S_filtered.length;
  const partFiltered = sum(S_filtered, p=>p.i);

  // Mapeo de iniciativas únicas en el conjunto filtrado
  const mFiltered = new Map();
  S_filtered.forEach(p=>p.ini.forEach(x=>{
    const o = mFiltered.get(x) || mFiltered.set(x, {n:x, ps:[], es:new Set()}).get(x);
    o.ps.push(p.n);
    o.es.add(p.e);
  }));
  const inisUnicas = mFiltered.size;
  const soloCount = [...mFiltered.values()].filter(x=>x.ps.length === 1).length;
  const depsCount = new Set(S_filtered.map(p=>p.d)).size;

  // Concentración top 10
  const ordColabs = [...S_filtered].sort((a,b)=>b.i - a.i);
  const top10Sum = sum(ordColabs.slice(0, 10), p=>p.i);

  // Subtítulo del encabezado
  const subHdr = $('#subHdrIni');
  if(subHdr) subHdr.textContent = (emp || 'Grupo Mayoreo') + (fDepIni ? ' · ' + fDepIni : '');

  // KPIs
  const kpisEl = $('#kpisIni');
  if(kpisEl){
    kpisEl.innerHTML = `
      <div><div class="t">Iniciativas distintas</div><div class="v num">${inisUnicas}</div><div class="p">en el corte actual</div></div>
      <div><div class="t">Colaboradores activos</div><div class="v num">${totalColabs} <small>${pc(totalColabs, hcOf(emp))}</small></div><div class="p">de la plantilla total</div></div>
      <div><div class="t">Total participaciones</div><div class="v num">${partFiltered}</div><div class="p num">${nf(totalColabs ? partFiltered / totalColabs : 0, 1)} por persona</div></div>
      <div><div class="t">Departamentos involucrados</div><div class="v num">${depsCount}</div><div class="p">en iniciativas de IA</div></div>
      <div><div class="t">Iniciativas individuales</div><div class="v num">${pc(soloCount, inisUnicas, 0)}</div><div class="p num">${soloCount} con un solo autor</div></div>
      <div><div class="t">Concentración</div><div class="v num">${pc(top10Sum, partFiltered, 0)}</div><div class="p">en las 10 personas más activas</div></div>
    `;
  }

  // Mapa de calor: Iniciativas por Empresa y Departamento
  const tbCalorEl = $('#tbCalorIni');
  if(tbCalorEl){
    const allDeps = [...new Set(D.filter(p=>p.i>0).map(p=>p.d))].sort((a,b)=>{
      return sum(D.filter(p=>p.d===b&&p.i>0), p=>p.i) - sum(D.filter(p=>p.d===a&&p.i>0), p=>p.i);
    });
    const es = Object.keys(HC);
    const mxc = Math.max(...allDeps.flatMap(d => es.map(e => sum(D.filter(p=>p.e===e && p.d===d && p.i>0), p=>p.i))), 1);

    const rowsHtml = allDeps.map(d => {
      const isDepSel = fDepIni === d;
      const totD = sum(D.filter(p=>p.d===d && p.i>0), p=>p.i);
      const cells = es.map(e => {
        const a = D.filter(p=>p.e===e && p.d===d && p.i>0);
        const n = sum(a, p=>p.i);
        const u = new Set(a.flatMap(p=>p.ini)).size;
        const isCellEmp = emp === e;
        const tip = n ? `${e} · ${d}\n${n} participaciones en ${u} iniciativas\n${a.length} colaborador(es)\nHaz clic para filtrar` : '';
        const bg = n ? `background:color-mix(in srgb,var(--azul) ${Math.round(8 + 52 * n / mxc)}%,transparent)` : '';
        const activeBorder = (isCellEmp && isDepSel && n) ? ';outline:2px solid var(--azul-oscuro);outline-offset:-1px;font-weight:bold' : '';
        return `<td style="cursor:${n ? 'pointer' : 'default'}" data-calor-cell data-calor-emp="${e}" data-calor-dep="${esc(d)}"><div ${n ? `style="${bg}${activeBorder}" data-tip="${tip}"` : ''}>${n || '·'}</div></td>`;
      }).join('');
      return `<tr${isDepSel ? ' style="background:var(--azul-tenue)"' : ''}>
        <td class="izq" style="cursor:pointer;font-weight:${isDepSel ? 'bold' : 'normal'}" data-calor-dep="${esc(d)}" title="Filtrar por ${esc(d)}">${isDepSel ? '▶ ' : ''}${esc(d)}</td>
        ${cells}
        <td style="font-weight:bold;cursor:pointer" data-calor-dep="${esc(d)}" title="Filtrar por ${esc(d)}"><div>${totD}</div></td>
      </tr>`;
    }).join('');

    const totRowCells = es.map(e => {
      const totE = sum(D.filter(p=>p.e===e && p.i>0), p=>p.i);
      const isEmpSel = emp === e;
      return `<td style="font-weight:bold;cursor:pointer;text-align:center" data-calor-emp="${e}" title="Filtrar por ${e}"><div style="${isEmpSel ? 'background:var(--azul-tenue);border-radius:4px' : ''}">${totE}</div></td>`;
    }).join('');
    const grandTot = sum(D.filter(p=>p.i>0), p=>p.i);
    const totRow = `<tr class="calc"><td class="izq"><b>Total empresa</b></td>${totRowCells}<td style="font-weight:bold;text-align:center"><div>${grandTot}</div></td></tr>`;

    tbCalorEl.innerHTML = rowsHtml + totRow;
  }

  // Tramos de producción
  const tbTramosEl = $('#tbTramosIni');
  if(tbTramosEl){
    const tr = [['1 iniciativa', p=>p.i===1], ['2 a 3', p=>p.i>=2&&p.i<=3], ['4 a 6', p=>p.i>=4&&p.i<=6], ['7 o más', p=>p.i>=7]]
      .map(([l, f]) => { const a = S_filtered.filter(f); return { l, n: a.length, v: sum(a, p=>p.i) }; });
    tbTramosEl.innerHTML = tr.map(x => `<tr>
      <td class="izq">${x.l}</td>
      <td>${x.n}</td>
      <td>${pc(x.n, totalColabs, 0)}</td>
      <td>${x.v}</td>
      <td>${pc(x.v, partFiltered, 0)}<span class="mini"><span style="width:${partFiltered ? 100 * x.v / partFiltered : 0}%"></span></span></td>
    </tr>`).join('');
  }

  // Contador de la tabla
  const cntColabsEl = $('#cntColabsIni');
  if(cntColabsEl) cntColabsEl.textContent = totalColabs + ' colaboradores encontrados';

  // Filas de la tabla de Colaboradores en Iniciativas
  const tbIniEl = $('#tbIni');
  if(tbIniEl){
    const filasColabs = S_filtered.map(p => {
      const id = p.e + '|' + p.n;
      const isAbierto = abiertoIni === id;
      return `<tr class="fila" data-ini-id="${esc(id)}">
        <td class="izq"><b>${esc(p.n)}</b></td>
        <td class="izq">${p.e}</td>
        <td class="izq">${p.d}</td>
        <td><b>${p.i}</b></td>
        <td class="izq"><span class="sub" style="color:var(--azul-oscuro);font-size:12px;cursor:pointer;">${isAbierto ? 'Ocultar iniciativas ▲' : 'Ver ' + p.i + ' iniciativas ▼'}</span></td>
      </tr>` +
      (isAbierto ? `<tr class="det"><td colspan="5">
        <h4>Iniciativas de ${esc(p.n)} (${p.i})</h4>
        <ul>${p.ini.map(x => `<li><b>${esc(x)}</b></li>`).join('')}</ul>
      </td></tr>` : '');
    }).join('');
    tbIniEl.innerHTML = filasColabs || '<tr><td colspan="5" class="izq" style="padding:14px;color:var(--gris)">Ningún colaborador en iniciativas coincide con los filtros aplicados.</td></tr>';
  }
}

};

function parseCSV(text) {
  const lines = [];
  let row = [''];
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    const next = text[i + 1];
    if (c === '"') {
      if (inQuotes && next === '"') {
        row[row.length - 1] += '"';
        i++;
      } else {
        inQuotes = !inQuotes;
      }
    } else if (c === ',' && !inQuotes) {
      row.push('');
    } else if ((c === '\r' || c === '\n') && !inQuotes) {
      if (c === '\r' && next === '\n') i++;
      lines.push(row);
      row = [''];
    } else {
      row[row.length - 1] += c;
    }
  }
  if (row.length > 1 || row[0] !== '') lines.push(row);
  return lines;
}

// Carga via JSONP como fallback si fetch directo fuese bloqueado por política de red
function fetchGvizJsonp(gid) {
  return new Promise((resolve, reject) => {
    const cb = '__gviz_sync_' + Math.random().toString(36).slice(2);
    let resolved = false;
    window[cb] = function(resp) {
      if (resolved) return;
      resolved = true;
      try { delete window[cb]; } catch(_) {}
      s.remove();
      if (!resp || !resp.table || !resp.table.rows) return resolve([]);
      const rows = [];
      const colLabels = (resp.table.cols || []).map(c => c && c.label ? c.label : '');
      if (colLabels.some(Boolean)) rows.push(colLabels);
      resp.table.rows.forEach(r => {
        if (!r.c) return;
        rows.push(r.c.map(cell => cell && cell.v != null ? String(cell.v).trim() : ''));
      });
      resolve(rows);
    };
    const s = document.createElement('script');
    s.src = 'https://docs.google.com/spreadsheets/d/' + GOOGLE_SHEET_CONFIG.sheetId + '/gviz/tq?tqx=responseHandler:' + cb + '&tq=select%20*&gid=' + gid;
    s.onerror = () => {
      if (resolved) return;
      resolved = true;
      try { delete window[cb]; } catch(_) {}
      s.remove();
      reject(new Error('JSONP error'));
    };
    document.head.appendChild(s);
    setTimeout(() => {
      if (!resolved) {
        resolved = true;
        try { delete window[cb]; } catch(_) {}
        s.remove();
        reject(new Error('Timeout'));
      }
    }, 12000);
  });
}

async function fetchSheetData(gid) {
  try {
    const res = await fetch(GOOGLE_SHEET_CONFIG.pubBase + gid, { cache: 'no-cache' });
    if (res.ok) {
      const txt = await res.text();
      const parsed = parseCSV(txt);
      if (parsed.length > 0) return parsed;
    }
  } catch (_) {}
  // Fallback JSONP
  return await fetchGvizJsonp(gid);
}

let sincronizando = false;
async function sincronizarDatosGoogleSheet(esManual = false) {
  if (sincronizando) return;
  sincronizando = true;
  const icon = $('#refreshIcon');
  if (icon) icon.classList.add('spinning');
  const msgEl = $('#msg');
  if (msgEl && esManual) msgEl.textContent = 'Sincronizando con Google Sheets...';

  const pad = n => n < 10 ? '0' + n : n;
  const ahora = new Date();
  const timeStr = pad(ahora.getHours()) + ':' + pad(ahora.getMinutes()) + ':' + pad(ahora.getSeconds());

  try {
    const [planRows, consRows, formRows, iniRows] = await Promise.all([
      fetchSheetData(GOOGLE_SHEET_CONFIG.gids.plantillas),
      fetchSheetData(GOOGLE_SHEET_CONFIG.gids.consolidado),
      fetchSheetData(GOOGLE_SHEET_CONFIG.gids.formaciones),
      fetchSheetData(GOOGLE_SHEET_CONFIG.gids.iniciativas)
    ]);

    // 1. Parsear Plantillas HC
    const newHC = {};
    const totalRow = planRows.find(r => r.some(c => c.toLowerCase().includes('total por empresa')));
    const planHeaderRow = planRows.find(r => r.some(c => c.toLowerCase().includes('febeca')));
    if (totalRow && planHeaderRow) {
      ['Febeca', 'Beval', 'Sillaca', 'Cofersa', 'Mundipartes', 'Prisma'].forEach(emp => {
        const idx = planHeaderRow.findIndex(h => h.trim().toLowerCase() === emp.toLowerCase());
        if (idx !== -1 && totalRow[idx]) {
          const val = parseInt(totalRow[idx].trim(), 10);
          if (!isNaN(val) && val > 0) newHC[emp] = val;
        }
      });
    }

    // 2. Mapear colaboradores desde la pestaña "Colaboradores en formaciones e Iniciativas IA"
    const norm = s => (s || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    const colabs = new Map();

    function getOrCreate(nom, emp, dep) {
      nom = (nom || '').trim();
      if (!nom || nom.toLowerCase() === 'colaborador') return null;
      const key = norm(nom);
      if (!colabs.has(key)) {
        colabs.set(key, {
          n: nom,
          e: emp ? emp.trim() : '',
          d: dep ? dep.trim() : '',
          i: 0,
          c: 0,
          h: 0,
          hi: 0,
          ini: [],
          per: '',
          cur: []
        });
      }
      const o = colabs.get(key);
      if (emp && (!o.e || o.e === 'Sin asignar')) o.e = emp.trim();
      if (dep && (!o.d || o.d === 'Sin asignar')) o.d = dep.trim();
      return o;
    }

    // 2.1 Cargar base de colaboradores desde "Colaboradores en formaciones e Iniciativas IA" (gid=1023385026)
    const consHeadIdx = consRows.findIndex(r => r.some(c => c.toLowerCase().trim() === 'colaborador'));
    if (consHeadIdx !== -1) {
      const head = consRows[consHeadIdx].map(c => c.toLowerCase().trim());
      const cNom = head.indexOf('colaborador');
      const cDep = head.findIndex(c => c.includes('area') || c.includes('departamento'));
      const cEmp = head.findIndex(c => c.includes('compañia') || c.includes('empresa'));
      const cIni = head.findIndex(c => c.includes('iniciativas') || c.includes('iniciativa'));
      const cCap = head.findIndex(c => c.includes('formacion') || c.includes('capacitacion') || c.includes('formaciones'));
      consRows.slice(consHeadIdx + 1).forEach(r => {
        const nom = (r[cNom] || '').trim();
        if (!nom || nom.toLowerCase() === 'colaborador') return;
        const dep = cDep !== -1 ? (r[cDep] || '').trim() : '';
        const emp = cEmp !== -1 ? (r[cEmp] || '').trim() : '';
        const iCount = cIni !== -1 ? (parseInt(r[cIni], 10) || 0) : 0;
        const cCount = cCap !== -1 ? (parseInt(r[cCap], 10) || 0) : 0;
        const key = norm(nom);
        colabs.set(key, {
          n: nom,
          e: emp,
          d: dep,
          i: iCount,
          c: cCount,
          h: 0,
          hi: 0,
          ini: [],
          per: '',
          cur: []
        });
      });
    }

    // 2.2 Cargar y enriquecer Formaciones (gid=0)
    const formHeadIdx = formRows.findIndex(r => r.some(c => c.toLowerCase().trim() === 'colaborador'));
    if (formHeadIdx !== -1) {
      const head = formRows[formHeadIdx].map(c => c.toLowerCase().trim());
      const cEmp = head.findIndex(c => c.includes('empresa'));
      const cDep = head.findIndex(c => c.includes('area') || c.includes('departamento'));
      const cNom = head.indexOf('colaborador');
      const cTipo = head.findIndex(c => c.includes('tipo'));
      const cHrs = head.findIndex(c => c.includes('duraci') || c.includes('hora'));
      const cCur = head.findIndex(c => c.includes('formaci') || c.includes('curso'));
      const cInst = head.findIndex(c => c.includes('instituto') || c.includes('facilitador'));

      formRows.slice(formHeadIdx + 1).forEach(r => {
        const nom = (r[cNom] || '').trim();
        const emp = cEmp !== -1 ? (r[cEmp] || '').trim() : '';
        const dep = cDep !== -1 ? (r[cDep] || '').trim() : '';
        const tipo = cTipo !== -1 ? (r[cTipo] || 'Interno').trim() : 'Interno';
        const hrsStr = cHrs !== -1 ? (r[cHrs] || '').trim() : '';
        const hrs = parseFloat(hrsStr.replace(/[^0-9.]/g, '')) || 0;
        const curso = cCur !== -1 ? (r[cCur] || '').trim() : '';
        const inst = cInst !== -1 ? (r[cInst] || '').trim() : '';

        if (!nom || nom.toLowerCase() === 'colaborador' || emp === 'Empresa' || !curso) return;

        const p = getOrCreate(nom, emp, dep);
        if (p) {
          p.cur.push([curso, tipo, inst, hrs]);
          p.h += hrs;
          if (tipo === 'Interno') p.hi += hrs;
        }
      });
    }

    // 2.3 Cargar y enriquecer Iniciativas (gid=433982814)
    const iniHeadIdx = iniRows.findIndex(r => r.some(c => c.toLowerCase().trim() === 'colaborador'));
    if (iniHeadIdx !== -1) {
      const head = iniRows[iniHeadIdx].map(c => c.toLowerCase().trim());
      const cEmp = head.findIndex(c => c.includes('empresa'));
      const cDep = head.findIndex(c => c.includes('area') || c.includes('departamento'));
      const cNom = head.indexOf('colaborador');
      const cIni = head.findIndex(c => c.includes('iniciativa') || c.includes('mejora'));
      const cPer = head.findIndex(c => c.includes('medici') || c.includes('periodo'));

      iniRows.slice(iniHeadIdx + 1).forEach(r => {
        const nom = (r[cNom] || '').trim();
        const emp = cEmp !== -1 ? (r[cEmp] || '').trim() : '';
        const dep = cDep !== -1 ? (r[cDep] || '').trim() : '';
        const ini = cIni !== -1 ? (r[cIni] || '').trim() : '';
        const per = cPer !== -1 ? (r[cPer] || '').trim() : '';

        if (!nom || nom.toLowerCase() === 'colaborador' || emp === 'Empresa' || !ini) return;

        const p = getOrCreate(nom, emp, dep);
        if (p) {
          if (!p.ini.includes(ini)) p.ini.push(ini);
          if (per) {
            if (!p.per) p.per = per;
            else if (!p.per.includes(per)) p.per = p.per + ' / ' + per;
          }
        }
      });
    }

    // Filtrar estrictamente: solo colaboradores con participación real (c > 0 o i > 0)
    // Esto garantiza que solo los colaboradores con formación o iniciativas reales sean contabilizados
    const newD = [...colabs.values()].filter(p => p.c > 0 || p.i > 0);
    newD.forEach(p => {
      if (p.ini.length > p.i) p.i = p.ini.length;
      if (p.cur.length > p.c) p.c = p.cur.length;
      p.pf = (p.i > 0 && p.c > 0) ? 'A' : (p.i > 0 ? 'I' : 'F');
    });

    if (newD.length > 0) {
      D = newD;
      if (Object.keys(newHC).length > 0) HC = newHC;
      $('#fEmp').innerHTML = '<option value="">Todas (Grupo Mayoreo)</option>' + Object.keys(HC).map(e => `<option value="${e}"${e === emp ? ' selected' : ''}>${e}</option>`).join('');
      render();
      if (msgEl) {
        msgEl.textContent = 'Actualizado en vivo (' + timeStr + ') · ' + D.length + ' colaboradores';
        setTimeout(() => { if (msgEl.textContent.startsWith('Actualizado')) msgEl.textContent = ''; }, 5000);
      }
    }
  } catch (err) {
    console.warn('Error sincronizando con Google Sheets:', err);
    render();
    if (msgEl) {
      msgEl.textContent = 'Actualizado local (' + timeStr + ')';
      setTimeout(() => { if (msgEl.textContent.startsWith('Actualizado')) msgEl.textContent = ''; }, 4000);
    }
  } finally {
    sincronizando = false;
    if (icon) icon.classList.remove('spinning');
  }
}

    $('#fEmp').value = '';

  }

  // Expansión de filas en tabla de Iniciativas
  const rIni = e.target.closest('tr.fila[data-ini-id]');
  if(rIni){
    abiertoIni = abiertoIni === rIni.dataset.iniId ? null : rIni.dataset.iniId;
    filasIni();
    return;
  }

  // Expansión de filas en tabla de Colaboradores
  const r=e.target.closest('tr.fila[data-id]');
  if(r){
    abierto=abierto===r.dataset.id?null:r.dataset.id;
    filas();
  }
});

/* ---------- Exportación y Descarga ---------- */
function filtrados(){
  const k=q.trim().toLowerCase();
  return scope().filter(p=>(!fDep||p.d===fDep)&&(!fPf||p.pf===fPf)&&(!k||(p.n+' '+p.ini.join(' ')+' '+p.cur.map(c=>c[0]).join(' ')).toLowerCase().includes(k)));
}

function exportarCsvIniciativas(){
  const k=qIni.trim().toLowerCase();
  const S_filtered=scope().filter(p=>p.i>0).filter(p=>{
    const matchDep = !fDepIni || p.d === fDepIni;
    const matchQ = !k || (p.n + ' ' + p.ini.join(' ')).toLowerCase().includes(k);
    return matchDep && matchQ;
  });
  const cab=['Colaborador','Empresa','Departamento','Periodo','Num_Iniciativas','Iniciativas'];
  const rows=S_filtered.map(p=>[p.n, p.e, p.d, p.per, p.i, p.ini.join(' | ')]);
  descargarCsvBlob('colaboradores_en_iniciativas', cab, rows);
}

function datosVista(){
  const S=scope(), dec=x=>String(x).replace('.',','), pp=(a,b)=>b?dec((100*a/b).toFixed(1)):'';
  const per=a=>a.map(p=>[p.n,p.e,p.d,PF[p.pf],p.i,p.c,dec(p.h),p.per,p.ini.join(' | '),p.cur.map(c=>c[0]).join(' | ')]);
  const hP=['Colaborador','Empresa','Departamento','Perfil de participación','Iniciativas','Formaciones','Horas de formación','Periodos','Detalle de iniciativas','Detalle de formaciones'];

  if(tab==='indicador'){
    const r=Object.keys(HC).filter(e=>!emp||e===emp).map(e=>{const x=st(D.filter(p=>p.e===e),HC[e]);return[e,x.hc,x.n,pp(x.n,x.hc),x.A,x.I,x.F,x.sin,x.form,x.ini]});
    return['indicador_ia_por_empresa',['Empresa','Plantilla','Colaboradores en IA','% en IA','Formación + iniciativas','Solo iniciativas','Solo formación','Sin participación','Con formación','Con iniciativas'],r];
  }
  if(tab==='conversion'){
    const r=[...grp(S,p=>p.e+'\u0001'+p.d)].map(([k,a])=>{const x=st(a,0),[e,d]=k.split('\u0001');return[e,d,x.n,x.form,x.ini,x.A,x.F,x.I,pp(x.A,x.form)]});
    return['conversion_por_empresa_y_departamento',['Empresa','Departamento','Participantes','Con formación','Con iniciativas','Formación + iniciativas','Solo formación','Solo iniciativas','% conversión'],r];
  }
  if(tab==='iniciativas'){
    const k=qIni.trim().toLowerCase();
    const S_filtered=S.filter(p=>p.i>0).filter(p=>(!fDepIni||p.d===fDepIni)&&(!k||(p.n+' '+p.ini.join(' ')).toLowerCase().includes(k)));
    return['colaboradores_en_iniciativas',['Colaborador','Empresa','Departamento','Periodo','Num_Iniciativas','Iniciativas'],S_filtered.map(p=>[p.n,p.e,p.d,p.per,p.i,p.ini.join(' | ')])];
  }
  if(tab==='formacion')return['formaciones_ia',['Empresa','Departamento','Colaborador','Tipo','Curso','Instituto','Horas'],S.flatMap(p=>p.cur.map(c=>[p.e,p.d,p.n,c[1],c[0],c[2],dec(c[3])]))];
  if(tab==='personas')return['colaboradores_ia',hP,per(filtrados())];
  return['colaboradores_ia',hP,per(S)];
}

function descargarCsvBlob(nombre, cab, rows){
  const c=v=>{v=String(v??'');return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const csv='﻿'+[cab,...rows].map(r=>r.map(c).join(';')).join('\r\n');
  const fn=nombre+(emp?'_'+emp.toLowerCase():'')+'_2026-10-02.csv';
  const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  const l=document.createElement('a');
  l.href=u;l.download=fn;document.body.appendChild(l);l.click();l.remove();
  setTimeout(()=>URL.revokeObjectURL(u),2000);
  const msg=$('#msg');
  if(msg) msg.textContent='Archivo descargado ('+rows.length+' filas).';
}

let descargas=null;
(async()=>{try{descargas=await window.claude?.use?.('downloads')}catch(_){}
  if(descargas||!window.claude)$('#dl').hidden=false})();

$('#dl').addEventListener('click',async()=>{
  const [nom,cab,rows]=datosVista(), c=v=>{v=String(v??'');return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const csv='﻿'+[cab,...rows].map(r=>r.map(c).join(';')).join('\r\n');
  const msg=$('#msg');
  const fn=nom+(emp?'_'+emp.toLowerCase():'')+'_2026-10-02.csv';
  if(!descargas){
    const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),l=document.createElement('a');
    l.href=u;l.download=fn;document.body.appendChild(l);l.click();l.remove();
    setTimeout(()=>URL.revokeObjectURL(u),2000);
    msg.textContent='Archivo descargado ('+rows.length+' filas).';
    return;
  }
  try{
    await descargas.save({filename:fn,data:csv});
    msg.textContent='Archivo descargado ('+rows.length+' filas).';
  }catch(err){
    msg.textContent=err&&err.code==='declined'?'':'No se pudo descargar en esta vista.';
  }
});
